name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Show errors
        if: failure()
        run: grep -A3 "error:" build.log | head -120
      - uses: actions/upload-artifact@v4
        with:
          name: learnclient-jar
          path: build/libs/*.jar
